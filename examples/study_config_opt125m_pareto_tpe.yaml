study:
  prefix: "opt125m_pareto_tpe"

backend: "afsbox"

afsbox:
  namespace: "afsbox-tokenfactory"
  tuning_name: "optuna-tune"
  serving_name: "optuna-tune-exp"
  cleanup_serving: true
  deploy_timeout_seconds: 300
  poll_interval_seconds: 5
  serving_template:
    image: "docker.io/vllm/vllm-openai:v0.27.1"
    engine:
      servicePort: 8000
      type: vllm
    modelType: llm
    servedModelName: opt-125m
    command:
      - "vllm"
      - "serve"
      - "/models/afsbox/facebook/opt-125m/latest"
      - "--served-model-name=opt-125m"
      - "--port=8000"
      - "--enforce-eager"
      - "--chat-template=/vllm-workspace/examples/template_chatml.jinja"
    model:
      valueFrom:
        kind: ClusterModelRepository
        name: facebook-opt-125m
    replicas: 1
    externalAccess: false
    cacheAwareRouting: false
    gpuClaim:
      className: nvidia-gb10
      requests:
        memoryMB: 16384
    parallelism:
      tp: 1
    contextLength: "2048"
    batchSize: "32"
    gpuMemoryUtilization: "0.8"

baseline:
  enabled: false

optimization:
  approach: "multi_objective"
  objectives:
    - metric: "output_tokens_per_second"
      direction: "maximize"
      percentile: "p50"
    - metric: "time_to_first_token_ms"
      direction: "minimize"
      percentile: "p50"
  sampler: "tpe"
  n_trials: 20
  n_startup_trials: 5
  max_concurrent_trials: 1

benchmark:
  benchmark_type: "aiperf"
  model: "opt-125m"
  samples: 10
  rate: 4
  prompt_tokens: 64
  output_tokens: 32
  max_seconds: 60

parameters:
  batch_size:
    enabled: true
    options: [8, 16, 32, 64]

  gpu_memory_utilization:
    enabled: true
    min: 0.65
    max: 0.85
    step: 0.05
