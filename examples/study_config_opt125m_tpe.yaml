study:
  prefix: "opt125m_tpe"

backend: "afsbox"

afsbox:
  namespace: "afsbox-tokenfactory"
  tuning_name: "optuna-tune"
  deploy_timeout_seconds: 300
  poll_interval_seconds: 5

optimization:
  approach: "single_objective"
  objectives:
    - metric: "output_tokens_per_second"
      direction: "maximize"
      percentile: "p50"
  sampler: "tpe"
  n_trials: 20
  n_startup_trials: 5
  max_concurrent_trials: 1

benchmark:
  benchmark_type: "aiperf"
  model: "afsbox/opt-125m"
  samples: 10
  rate: 4
  prompt_tokens: 64
  output_tokens: 32
  max_seconds: 60

parameters:
  batch_size:
    enabled: true
    options: [8, 16, 32, 64]

  gpu_memory_utilization:
    enabled: true
    min: 0.65
    max: 0.85
    step: 0.05
